{{- $eso := .Values.externalSecretsOperator }}
{{- /*
A namespaced SecretStore is created only when the ExternalSecrets reference one.
A ClusterSecretStore is cluster-scoped and owned by the platform, so with
secretStore.kind: ClusterSecretStore the chart only references it by name.
*/}}
{{- if and $eso.enabled $eso.secretStore.create (eq ($eso.secretStore.kind | default "SecretStore") "SecretStore") }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $eso.secretStore.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperswitch-ucs.labels" . | nindent 4 }}
spec:
  provider:
    {{- toYaml $eso.secretStore.provider | nindent 4 }}
{{- end }}
