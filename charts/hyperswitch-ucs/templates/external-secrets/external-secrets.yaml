{{- $eso := .Values.externalSecretsOperator }}
{{- if $eso.enabled }}
{{- range $eso.externalSecrets.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hyperswitch-ucs.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ $eso.secretStore.name }}
    kind: {{ $eso.secretStore.kind | default "SecretStore" }}
  target:
    name: {{ .targetName }}
    creationPolicy: {{ .creationPolicy | default "Owner" }}
    {{- with .template }}
    template:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- if .data }}
  data:
  {{- range .data }}
  - secretKey: {{ .secretKey }}
    remoteRef:
      key: {{ .remoteRef.key }}
      {{- if .remoteRef.version }}
      version: {{ .remoteRef.version }}
      {{- end }}
      {{- if .remoteRef.property }}
      property: {{ .remoteRef.property }}
      {{- end }}
  {{- end }}
  {{- end }}
  {{- if .dataFrom }}
  dataFrom:
  {{- range .dataFrom }}
  - extract:
      key: {{ .extract.key }}
      {{- if .extract.version }}
      version: {{ .extract.version }}
      {{- end }}
      {{- if .extract.property }}
      property: {{ .extract.property }}
      {{- end }}
      conversionStrategy: {{ .extract.conversionStrategy | default "Default" }}
      decodingStrategy: {{ .extract.decodingStrategy | default "None" }}
      metadataPolicy: {{ .extract.metadataPolicy | default "None" }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
