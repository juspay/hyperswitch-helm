apiVersion: v1
kind: Service
metadata:
  name: {{ include "hyperswitch-ucs.fullname" . }}
  labels:
    {{- include "hyperswitch-ucs.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.grpc.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: {{ .Values.service.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- range .Values.service.additionalPorts }}
    - name: {{ required "service.additionalPorts[].name is required" .name }}
      port: {{ required "service.additionalPorts[].port is required" .port }}
      targetPort: {{ required "service.additionalPorts[].targetPort is required" .targetPort }}
      protocol: {{ .protocol | default "TCP" }}
      {{- with .appProtocol }}
      appProtocol: {{ . }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "hyperswitch-ucs.selectorLabels" . | nindent 4 }}
