# Default values for hyperswitch-ucs.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  # Global image registry that can override all imageRegistry fields
  imageRegistry: null
# -- Number of replicas for the UCS deployment
# @section -- Connector Service
replicaCount: 1
# -- Container image configuration
# @section -- Connector Service
image:
  # -- Docker image registry
  # @section -- Connector Service
  imageRegistry: ghcr.io
  # -- Docker image repository
  # @section -- Connector Service
  repository: juspay/connector-service
  # -- Image pull policy
  # @section -- Connector Service
  pullPolicy: IfNotPresent
  # -- Image tag to use
  # @section -- Connector Service
  tag: "1106f6ea49"
# -- Image pull secrets for private registries
# @section -- Connector Service
imagePullSecrets: []
# -- Override the name of the chart
# @section -- Connector Service
nameOverride: ""
# -- Override the full name of the chart
# @section -- Connector Service
fullnameOverride: ""
# -- Service account configuration
# @section -- Connector Service
serviceAccount:
  # -- Specifies whether a service account should be created
  # @section -- Connector Service
  create: true
  # -- Annotations to add to the service account
  # @section -- Connector Service
  annotations: {}
  # -- The name of the service account to use. If not set and create is true, a name is generated using the fullname template
  # @section -- Connector Service
  name: ""
# -- Annotations to add to the pod
# @section -- Connector Service
podAnnotations: {}
# -- Pod security context
# @section -- Connector Service
podSecurityContext: {}
# fsGroup: 2000

# -- Container security context
# @section -- Connector Service
securityContext: {}
# capabilities:
#   drop:
#   - ALL
# readOnlyRootFilesystem: true
# runAsNonRoot: true
# runAsUser: 1000

# -- Service configuration
# @section -- Connector Service
service:
  # -- Service type
  # @section -- Connector Service
  type: ClusterIP
  # -- gRPC service configuration
  # @section -- Connector Service
  grpc:
    # -- gRPC service port
    # @section -- Connector Service
    port: 8000
    # -- gRPC container port
    # @section -- Connector Service
    targetPort: 8000
  # -- Metrics service configuration
  # @section -- Connector Service
  metrics:
    # -- Metrics service port
    # @section -- Connector Service
    port: 8080
    # -- Metrics container port
    # @section -- Connector Service
    targetPort: 8080
# -- ServiceMonitor configuration for Victoria Metrics / Prometheus scraping
# @section -- Connector Service
serviceMonitor:
  # -- Enable ServiceMonitor resource
  # @section -- Connector Service
  enabled: false
  # -- Namespace to deploy ServiceMonitor (defaults to release namespace)
  # @section -- Connector Service
  namespace: ""
  # -- Additional labels for the ServiceMonitor
  # @section -- Connector Service
  labels: {}
  # -- Port name to scrape (must match service port name)
  # @section -- Connector Service
  portName: "metrics"
  # -- Metrics path
  # @section -- Connector Service
  path: "/metrics"
  # -- Scrape interval
  # @section -- Connector Service
  interval: ""
  # -- Scrape timeout
  # @section -- Connector Service
  scrapeTimeout: ""
  # -- HTTP scheme
  # @section -- Connector Service
  scheme: "http"
  # -- Relabeling rules
  # @section -- Connector Service
  relabelings: []
  # -- Metric relabeling rules
  # @section -- Connector Service
  metricRelabelings: []
  # -- Target labels
  # @section -- Connector Service
  targetLabels: []
# -- Ingress configuration
# @section -- Connector Service
ingress:
  # -- Enable ingress controller resource
  # @section -- Connector Service
  enabled: false
  # -- IngressClass that will be used to implement the Ingress
  # @section -- Connector Service
  className: ""
  # -- Additional annotations for the Ingress resource
  # @section -- Connector Service
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"
  # -- An array with hostname(s) to be covered with the ingress record
  # @section -- Connector Service
  hosts:
    - host: hyperswitch-ucs.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- TLS configuration for hostname(s) to be covered with this ingress record
  # @section -- Connector Service
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
# -- Resource limits and requests for the UCS containers
# @section -- Connector Service
resources:
  # -- Resource limits
  # @section -- Connector Service
  limits:
    # -- CPU limit
    # @section -- Connector Service
    cpu: 1000m
    # -- Memory limit
    # @section -- Connector Service
    memory: 1000Mi
  # -- Resource requests
  # @section -- Connector Service
  requests:
    # -- CPU request
    # @section -- Connector Service
    cpu: 400m
    # -- Memory request
    # @section -- Connector Service
    memory: 400Mi
# -- Autoscaling configuration
# @section -- Connector Service
autoscaling:
  # -- Enable autoscaling
  # @section -- Connector Service
  enabled: false
  # -- Minimum number of replicas
  # @section -- Connector Service
  minReplicas: 1
  # -- Maximum number of replicas
  # @section -- Connector Service
  maxReplicas: 100
  # -- Target CPU utilization percentage
  # @section -- Connector Service
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80
# -- Node labels for pod assignment
# @section -- Connector Service
nodeSelector: {}
# -- Tolerations for pod assignment
# @section -- Connector Service
tolerations: []
# -- Affinity for pod assignment
# @section -- Connector Service
affinity: {}
# -- Liveness probe configuration
# @section -- Connector Service
livenessProbe:
  # -- Number of failures before pod is restarted
  # @section -- Connector Service
  failureThreshold: 3
  # -- gRPC health check configuration
  # @section -- Connector Service
  grpc:
    # -- gRPC port for health check
    # @section -- Connector Service
    port: 8000
    # -- gRPC service name for health check
    # @section -- Connector Service
    service: grpc.health.v1.Health
  # -- Initial delay before probe starts
  # @section -- Connector Service
  initialDelaySeconds: 90
  # -- How often to perform the probe
  # @section -- Connector Service
  periodSeconds: 30
  # -- Minimum consecutive successes for the probe to be considered successful
  # @section -- Connector Service
  successThreshold: 1
  # -- Number of seconds after which the probe times out
  # @section -- Connector Service
  timeoutSeconds: 10
# -- Readiness probe configuration
# @section -- Connector Service
readinessProbe:
  # -- Number of failures before pod is marked unready
  # @section -- Connector Service
  failureThreshold: 5
  # -- gRPC health check configuration
  # @section -- Connector Service
  grpc:
    # -- gRPC port for health check
    # @section -- Connector Service
    port: 8000
    # -- gRPC service name for health check
    # @section -- Connector Service
    service: grpc.health.v1.Health
  # -- Initial delay before probe starts
  # @section -- Connector Service
  initialDelaySeconds: 30
  # -- How often to perform the probe
  # @section -- Connector Service
  periodSeconds: 30
  # -- Minimum consecutive successes for the probe to be considered successful
  # @section -- Connector Service
  successThreshold: 1
  # -- Number of seconds after which the probe times out
  # @section -- Connector Service
  timeoutSeconds: 5
# UCS Configuration via ConfigMap
config:
  # Log configuration
  log:
    # Console log configuration
    console:
      # -- Enable console logging
      # @section -- Connector Service Configurations
      enabled: true
      # -- Log level (DEBUG, INFO, WARN, ERROR)
      # @section -- Connector Service Configurations
      level: "DEBUG"
      # -- Log format (json, text)
      # @section -- Connector Service Configurations
      log_format: "json"
  # Server configuration
  server:
    # -- Server host address
    # @section -- Connector Service Configurations
    host: "0.0.0.0"
    # -- Server port
    # @section -- Connector Service Configurations
    port: 8000
    # -- Server type
    # @section -- Connector Service Configurations
    type: "grpc"
    # -- Runtime environment (production, sandbox)
    run_env: "sandbox"
  # Metrics server configuration
  metrics:
    # -- Metrics server host address
    # @section -- Connector Service Configurations
    host: "0.0.0.0"
    # -- Metrics server port
    # @section -- Connector Service Configurations
    port: 8080
  # Proxy configuration
  proxy:
    # -- HTTPS proxy URL
    # @section -- Connector Service Configurations
    https_url: "https_proxy"
    # -- HTTP proxy URL
    # @section -- Connector Service Configurations
    http_url: "http_proxy"
  # Any key under `config` may also be written as a secret or a reference instead of a
  # plain value (same conventions as the hyperswitch-app chart):
  #   token: { _secret: "value" }                     -> chart-managed Secret, key CS__…__TOKEN
  #   token: { _secretRef: { name: s, key: k } }       -> env CS__…__TOKEN from an existing Secret
  #   token: { _configRef: { name: c, key: k } }       -> env CS__…__TOKEN from an existing ConfigMap
  # `_secretRef` also accepts `optional: true` so the pod can start before the Secret exists.
# -- Disable the chart-managed Secret built from `_secret` values under `config` (set true when every secret arrives through `_secretRef` or the External Secrets Operator)
# @section -- Secrets
disableInternalSecrets: false
# External Secrets Operator resources, mirroring the hyperswitch-app chart: a SecretStore that
# authenticates as a service account, and one ExternalSecret per entry that materialises a
# Secrets Manager secret as a Kubernetes Secret for `config.*._secretRef` to point at.
# NOTE: the External Secrets Operator must already be installed in the cluster.
externalSecretsOperator:
  # -- Enable External Secrets Operator resources
  # @section -- Secrets
  enabled: false
  serviceAccount:
    # -- Create a dedicated service account for the SecretStore (leave false to authenticate as the application's service account)
    # @section -- Secrets
    create: false
    # -- Annotations for the service account (e.g. the IRSA role ARN)
    # @section -- Secrets
    annotations: {}
    # -- Extra labels for the service account
    # @section -- Secrets
    extraLabels: {}
    # -- Name of the service account (default: hyperswitch-ucs-eso-sa)
    # @section -- Secrets
    name: ""
  secretStore:
    # -- Create the SecretStore (set false to reference one that already exists)
    # @section -- Secrets
    create: true
    # -- Kind the ExternalSecrets reference: `SecretStore` (namespaced, created by this chart) or `ClusterSecretStore` (platform-owned, referenced only)
    # @section -- Secrets
    kind: SecretStore
    # -- Name of the SecretStore
    # @section -- Secrets
    name: "hyperswitch-ucs-secret-store"
    # -- Provider configuration in External Secrets Operator format (see https://external-secrets.io/latest/)
    # @section -- Secrets
    provider:
      aws:
        service: SecretsManager
        region: us-west-2
        auth:
          jwt:
            serviceAccountRef:
              name: hyperswitch-ucs
  externalSecrets:
    # -- ExternalSecrets to create; each entry takes `name`, `targetName`, `refreshInterval`, `creationPolicy`, an optional `template`, and `data` (single keys) or `dataFrom` (whole secret)
    # @section -- Secrets
    secrets: []
    # - name: hyperswitch-ucs-secrets
    #   targetName: hyperswitch-ucs-secrets
    #   refreshInterval: 1h
    #   creationPolicy: Owner
    #   dataFrom:
    #     - extract:
    #         key: sandbox/hyperswitch-ucs
    # - name: hyperswitch-ucs-superposition
    #   targetName: hyperswitch-ucs-superposition
    #   data:
    #     - secretKey: CS__SUPERPOSITION__TOKEN
    #       remoteRef:
    #         key: sandbox/hyperswitch-ucs
    #         property: CS__SUPERPOSITION__TOKEN
# -- Istio configuration
# @section -- Istio
istio:
  # -- Enable Istio resources
  enabled: false
  # -- VirtualService configuration
  virtualService:
    # -- Create VirtualService
    create: true
    # -- Hosts for the VirtualService
    hosts: []
    # -- Gateways for the VirtualService
    gateways: []
    # -- HTTP routing rules (ordered list)
    # Note: Rules are processed in the order they appear in this list.
    http:
      - name: "primary"
        match: []
        weight: 100
        timeout: 50s
        retries: {}
    # -- TCP routing rules for gRPC
    tcp: []
    # Example:
    # hosts:
    #   - ucs.example.com
    # gateways:
    #   - istio-system/gateway
    # http:
    #   - name: "grpc-routes"
    #     match:
    #       - port: 8000
    #     weight: 100
    #     timeout: 30s
    # tcp:
    #   - match:
    #       - port: 8000
    #     weight: 100
  # -- DestinationRule configuration
  destinationRule:
    # -- Traffic policy configuration - rendered directly as YAML
    trafficPolicy: {}
    # Example:
    # trafficPolicy:
    #   loadBalancer:
    #     simple: LEAST_CONN
    #   connectionPool:
    #     tcp:
    #       maxConnections: 100
# -- Argo Rollouts configuration
argoRollouts:
  # -- Enable Argo Rollouts instead of standard Deployment
  enabled: false
  # -- Number of old ReplicaSets to retain for rollback
  revisionHistoryLimit: 10
  canary:
    # -- Canary deployment steps (see Argo Rollouts docs)
    steps: []
    trafficRouting:
      istio:
        # -- Enable Istio traffic routing for canary
        enabled: false
        # -- VirtualService configuration for Argo Rollouts
        virtualService:
          # -- Route names to be managed by Argo Rollouts
          routeNames:
            - "primary"
        destinationRule:
          # -- Name of the canary subset in Istio DestinationRule
          canarySubsetName: "canary"
          # -- Name of the stable subset in Istio DestinationRule
          stableSubsetName: "stable"
      # -- Header-based routing configuration
      headerRouting:
        # -- Enable header-based canary routing
        enabled: false
        # -- Route name for header-based routing
        routeName: "header-canary"
        # -- Header match conditions
        match: []
        # Example:
        # match:
        #   - headerName: "x-canary"
        #     headerValue:
        #       exact: "true"
strategy: {}
env: []
services:
  ucs:
    version: 2025.12.05.0
