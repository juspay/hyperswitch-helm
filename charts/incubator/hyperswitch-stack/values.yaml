# loadbalancer security group
# @ignored
loadBalancer:
  targetSecurityGroup: &lb_security_group lg-security-group

# @ignored
service:
  type: ClusterIP
  port: 80

# @ignored
services:
  router:
    host: &router_host http://localhost:8080
  sdk:
    host: &web_sdk_host http://localhost:9050

global:
  # Global image registry to override all container image registries
  # If set, all container images will be pulled from this registry
  # If not set, each service will use its default registry
  # Example: "my-registry.com" or "localhost:5000"
  imageRegistry: &image_registry null
  image:
    registry: *image_registry

  tolerations: []
  # @ignored
  # Eg.
  # affinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #         - matchExpressions:
  #             - key: node-type
  #               operator: In
  #               values:
  #                 - generic-compute
  affinity: {}

# @ignored
hyperswitch-web:
  fullnameOverride: "hyperswitch-web"
  enabled: true
  sdkDemo:
    enabled: false
  image:
    pullPolicy: IfNotPresent
  podAnnotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
  autoBuild:
    enable: true
    forceBuild: true
    gitCloneParam:
      gitVersion: 0.129.0
    nginxConfig:
      extraPath: v1
    buildParam:
      envSdkUrl: *web_sdk_host
      envBackendUrl: *router_host
      envLogsUrl: http://localhost:3103
  service:
    port: 9050
  loadBalancer:
    targetSecurityGroup: "loadbalancer-sg"
  tolerations: []
  ingress:
    enabled: true
    className: "alb"
    apiVersion: networking.k8s.io/v1
    annotations:
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/backend-protocol-version: HTTP1
      alb.ingress.kubernetes.io/group.name: hyperswitch-web-alb-ingress-group
      alb.ingress.kubernetes.io/ip-address-type: ipv4
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      alb.ingress.kubernetes.io/load-balancer-name: hyperswitch-web
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/security-groups: *lb_security_group
      alb.ingress.kubernetes.io/tags: stack=hyperswitch-lb
      alb.ingress.kubernetes.io/target-type: ip
    hosts:
      - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hyperswitch-web
                port:
                  number: 80
# @ignored
hyperswitch-app:
  # The router needs a Superposition config source at boot: it calls `superposition.endpoint` and
  # only falls back to a local seed file when that call fails. Superposition starts empty, so the
  # fallback is what makes the first install come up - keep it on.
  #
  # By default an init container downloads config/superposition_seed.toml from the hyperswitch
  # repo at the router version this chart runs, so there is nothing to prepare. On a cluster with
  # no egress to raw.githubusercontent.com, create the ConfigMap yourself and switch source:
  #
  #   curl -sfLO https://raw.githubusercontent.com/juspay/hyperswitch/v1.126.0/config/superposition_seed.toml
  #   kubectl create configmap superposition-seed -n <namespace> \
  #     --from-file=superposition_seed.toml=superposition_seed.toml
  #   # then: superpositionFallback.source: configMap
  superpositionFallback:
    enabled: true
    source: fetch
  # Superposition runs against this release's PostgreSQL. The subchart takes its database host
  # from a plain value, which cannot carry the release name, so the chart publishes a fixed alias
  # Service that resolves to whatever this release's `postgresql.host` resolves to, and a Job that
  # applies the Superposition global schema. Safe here because one release owns the namespace.
  superpositionDB:
    enable: true
    aliasService: superposition-db
    migration:
      enable: true
  superposition:
    enabled: true
    configs:
      db_host: "superposition-db:5432"
      db_name: "hyperswitch"
      db_user: "hyperswitch"
    secrets:
      # Must match postgresql.global.postgresql.auth.password below.
      db_password: "ZGJwYXNzd29yZDEx"
      # Must match server.configs.superposition.token.
      superposition_token: "123456"
  initDB:
    enable: true
  loadBalancer:
    targetSecurityGroup: *lb_security_group
  # Image versions are deliberately not pinned here: they must match the router config files
  # (configs/router-*.toml) that ship inside the hyperswitch-app chart, so they follow that
  # chart's appVersion. Pinning them separately silently breaks the router when the
  # hyperswitch-app dependency above is bumped.
  services:
    router:
      imageRegistry: docker.juspay.io
      image: juspaydotin/hyperswitch-router
      host: *router_host
    consumer:
      imageRegistry: docker.juspay.io
      image: juspaydotin/hyperswitch-consumer
    producer:
      imageRegistry: docker.juspay.io
      image: juspaydotin/hyperswitch-producer
    drainer:
      imageRegistry: docker.juspay.io
      image: juspaydotin/hyperswitch-drainer
    sdk:
      host: *web_sdk_host
      version: 0.129.0
      subversion: v1
  server:
    replicas: 1
    secrets:
      # Follow https://github.com/juspay/hyperswitch/tree/main/crates/analytics#setting-up-forex-apis to get the forex api key
      forex_api_key: forex_api_key
      forex_fallback_api_key: forex_fallback_api_key
    locker:
      locker_enabled: true
    run_env: sandbox
    email:
      active_email_client: SMTP
    configs:
      proxy:
        enabled: false
      analytics:
        source: clickhouse
  controlCenter:
    env:
      default__features__email: "true"
      default__features__totp: "true"
      default__features__test_processors: "true"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80

  # Extra routers that run inside this release, sharing its PostgreSQL, Redis, Kafka and
  # ClickHouse. Both ship disabled - flip `enabled` to run them. Each one differs from the main
  # router by configuration alone; see charts/incubator/hyperswitch-app/values.yaml for the full
  # set of options.
  #
  # olap:                        # read/analytics traffic under /olap, write handle on the replica
  #   enabled: true
  #                              # OLAP points both database pools at the read replica as a write
  #                              # guardrail, so give the release one:
  #                              #   postgresql.readReplicas.replicaCount: 1
  #                              # With no replica the chart falls back to the primary and writes
  #                              # are no longer blocked.
  #   istio:
  #     enabled: true
  #     virtualService:
  #       # same host and gateway as hyperswitch-app.istio.virtualService
  #       hosts:
  #         - hyperswitch.example.com
  #       gateways:
  #         - istio-system/gateway
  # paymentMethodModular:        # /v1/payment-methods, /v1/customers, /v1/proxy ...
  #   enabled: true
  #   istio:
  #     enabled: true
  #     virtualService:
  #       hosts:
  #         - hyperswitch.example.com
  #       gateways:
  #         - istio-system/gateway

  hyperswitch-card-vault:
    enabled: true
    server:
      imageRegistry: docker.juspay.io
      image: juspaydotin/hyperswitch-card-vault:v0.6.5-dev
      tenant_secrets:
        hyperswitch:
          master_key: "8283d68fdbd89a78aef9bed8285ed1cd9310012f660eefbad865f20a3f3dd9498f06147da6a7d9b84677cafca95024990b3d2296fbafc55e10dd76df"
          public_key: ""
          schema: "public"

    initDB:
      enable: true
    postgresql:
      primary:
        tolerations: []
  redis:
    master:
      tolerations: []
  postgresql:
    primary:
      tolerations: []
    readReplicas:
      tolerations: []
  kafka:
    controller:
      tolerations: []
    broker:
      tolerations: []
    zookeeper:
      tolerations: []
    provisioning:
      tolerations: []
  clickhouse:
    tolerations: []
    zookeeper:
      tolerations: []
  mailhog:
    tolerations: []
  vector:
    tolerations: []
  # UCS (Unified Connector Service) ships as a dependency of hyperswitch-app.
  # Override its values here, e.g. `hyperswitch-app.hyperswitch-ucs.image.tag`.
  hyperswitch-ucs:
    enabled: false

hyperswitch-monitoring:
  enabled: true
  # Pass global imageRegistry to monitoring subcharts
  global:
    tolerations: []
  # Component-specific tolerations
  kube-prometheus-stack:
    prometheus:
      prometheusSpec:
        tolerations: []
    grafana:
      tolerations: []
    alertmanager:
      alertmanagerSpec:
        tolerations: []
  loki:
    singleBinary:
      tolerations: []
  promtail:
    tolerations: []
  opentelemetry-collector:
    tolerations: []

hyperswitch-control-center:
  enabled: true
  fullnameOverride: "hyperswitch-control-center"
  # Dependencies - connect to hyperswitch services
  dependencies:
    router:
      host: *router_host
    sdk:
      host: *web_sdk_host
      version: 0.129.0
      subversion: v1
    clickhouse:
      enabled: true
  # Image configuration
  image:
    registry: docker.juspay.io
    repository: juspaydotin/hyperswitch-control-center
    pullPolicy: IfNotPresent
    tag: v1.38.2
  # Service configuration
  service:
    type: ClusterIP
    port: 9000
  # Resource requests
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  tolerations: []
