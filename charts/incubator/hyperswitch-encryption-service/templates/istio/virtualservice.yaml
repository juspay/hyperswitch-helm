{{- if and .Values.istio.enabled .Values.istio.virtualService.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ include "hyperswitch-encryption-service.fullname" . }}-vs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperswitch-encryption-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: istio-virtual-service
spec:
  {{- with .Values.istio.virtualService.hosts }}
  hosts:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.istio.virtualService.gateways }}
  gateways:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.istio.virtualService.http }}
  http:
  {{- if and .Values.argoRollouts.enabled .Values.argoRollouts.canary.trafficRouting.istio.enabled .Values.argoRollouts.canary.trafficRouting.headerRouting.enabled }}
  # Header-based canary routing (highest priority)
  - name: {{ .Values.argoRollouts.canary.trafficRouting.headerRouting.routeName | quote }}
    match:
    {{- range .Values.argoRollouts.canary.trafficRouting.headerRouting.match }}
    - headers:
        {{ .headerName }}:
          {{- toYaml .headerValue | nindent 10 }}
    {{- end }}
    route:
    - destination:
        host: {{ include "hyperswitch-encryption-service.fullname" . }}
        subset: {{ .Values.argoRollouts.canary.trafficRouting.istio.destinationRule.canarySubsetName }}
        port:
          number: {{ .Values.service.port }}
      weight: 100
  {{- end }}
  {{- range .Values.istio.virtualService.http }}
  - {{- if .name }}
    name: {{ .name | quote }}
    {{- end }}
    {{- if .match }}
    match:
      {{- toYaml .match | nindent 6 }}
    {{- end }}
    {{- if .rewrite }}
    rewrite:
      {{- toYaml .rewrite | nindent 6 }}
    {{- end }}
    {{- if .timeout }}
    timeout: {{ .timeout }}
    {{- end }}
    {{- if .retries }}
    retries:
      {{- toYaml .retries | nindent 6 }}
    {{- end }}
    route:
    {{- if and $.Values.argoRollouts.enabled $.Values.argoRollouts.canary.trafficRouting.istio.enabled (mustHas .name $.Values.argoRollouts.canary.trafficRouting.istio.virtualService.routeNames) }}
    # Argo Rollouts manages these weights during a canary deployment
    - destination:
        host: {{ include "hyperswitch-encryption-service.fullname" $ }}
        subset: {{ $.Values.argoRollouts.canary.trafficRouting.istio.destinationRule.stableSubsetName }}
        port:
          number: {{ $.Values.service.port }}
      weight: 100
    - destination:
        host: {{ include "hyperswitch-encryption-service.fullname" $ }}
        subset: {{ $.Values.argoRollouts.canary.trafficRouting.istio.destinationRule.canarySubsetName }}
        port:
          number: {{ $.Values.service.port }}
      weight: 0
    {{- else }}
    - destination:
        host: {{ include "hyperswitch-encryption-service.fullname" $ }}
        port:
          number: {{ $.Values.service.port }}
      {{- if .weight }}
      weight: {{ .weight }}
      {{- else }}
      weight: 100
      {{- end }}
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
