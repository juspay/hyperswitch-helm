{{- if .Values.argoRollouts.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "hyperswitch-encryption-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- with (default .Values.global.annotations .Values.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "hyperswitch-encryption-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds}}
  {{- if .Values.argoRollouts.enabled }}
  revisionHistoryLimit: {{ .Values.argoRollouts.revisionHistoryLimit }}
  {{- else }}
  revisionHistoryLimit: 10
  {{- end }}
  {{- if .Values.argoRollouts.enabled }}
  # Argo Rollouts strategy configuration
  strategy:
    canary:
      {{- with .Values.argoRollouts.canary.steps }}
      steps:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.argoRollouts.canary.maxSurge }}
      maxSurge: {{ . }}
      {{- end }}
      {{- with .Values.argoRollouts.canary.maxUnavailable }}
      maxUnavailable: {{ . }}
      {{- end }}
      {{- if .Values.argoRollouts.canary.trafficRouting.istio.enabled }}
      {{- if not (and .Values.istio.enabled .Values.istio.virtualService.enabled .Values.istio.destinationRule.enabled) }}
      {{- fail "istio.enabled, istio.virtualService.enabled and istio.destinationRule.enabled must all be true when argoRollouts.canary.trafficRouting.istio.enabled is set" }}
      {{- end }}
      trafficRouting:
        istio:
          virtualService:
            name: {{ include "hyperswitch-encryption-service.fullname" . }}-vs
            {{- with .Values.argoRollouts.canary.trafficRouting.istio.virtualService.routeNames }}
            routes:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          destinationRule:
            name: {{ include "hyperswitch-encryption-service.fullname" . }}-dr
            canarySubsetName: {{ .Values.argoRollouts.canary.trafficRouting.istio.destinationRule.canarySubsetName }}
            stableSubsetName: {{ .Values.argoRollouts.canary.trafficRouting.istio.destinationRule.stableSubsetName }}
      {{- end }}
  {{- else }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hyperswitch-encryption-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "hyperswitch-encryption-service.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hyperswitch-encryption-service.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds}}
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
        - name: ndots
          value: "1"
        - name: single-request-reopen
      {{- with (default .Values.global.tolerations .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.affinity .Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.nodeSelector .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.initDB.enable }}
      initContainers:
        {{- include "encryption-service-psql.initContainer.check.ready" . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "hyperswitch-encryption-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          lifecycle:
            preStop:
              exec:
                command:
                - /bin/bash
                - -c
                - pkill -15 node
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          ports:
            {{- range .Values.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: CRIPTA__DATABASE__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "encryption-service-psql.secret.name" . }}
                  key: {{ include "encryption-service-psql.secret.key" . }}
            {{- include "hyperswitch-encryption-service.configToEnvRefs" (dict "config" .Values.configs "prefix" "CRIPTA" "context" .) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "hyperswitch-encryption-service.fullname" . }}
            {{- if not .Values.disableInternalSecrets }}
            - secretRef:
                name: {{ include "hyperswitch-encryption-service.fullname" . }}-secrets
            {{- end }}
            {{- if .Values.externalSecretsOperator.enabled }}
            {{- range .Values.externalSecretsOperator.externalSecrets.secrets }}
            - secretRef:
                name: {{ .targetName }}
            {{- end }}
            {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
