{{- if .Values.services.drainer.enabled }}
{{- $ar := .Values.argoRollouts -}}
{{- if .Values.drainer.argoRollouts -}}
{{- $ar = mergeOverwrite (deepCopy .Values.argoRollouts) (deepCopy .Values.drainer.argoRollouts) -}}
{{- end -}}
{{- if $ar.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "hyperswitch-drainer.name" . }}
  namespace: {{ include "drainer.namespace" . }}
  labels:
    {{- include "hyperswitch.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "hyperswitch-drainer.name" . }}
    app.kubernetes.io/version: {{ .Values.services.drainer.version | toString | quote }}
    app: {{ include "hyperswitch-drainer.name" . }}
    version: {{ include "version.suffix" (.Values.services.drainer.version | toString) | quote }}
spec:
  replicas: {{ .Values.drainer.replicas }}
  progressDeadlineSeconds: {{ .Values.drainer.progressDeadlineSeconds | default .Values.global.progressDeadlineSeconds }}
  {{- if $ar.enabled }}
  revisionHistoryLimit: {{ $ar.revisionHistoryLimit }}
  # Argo Rollouts strategy configuration.
  # The drainer has no Service, VirtualService or DestinationRule and exposes no request
  # metrics, so the inherited `argoRollouts.canary.trafficRouting` and `.canary.analysis` are
  # deliberately not rendered here. The canary is replica-based: `setWeight: N` sizes the
  # canary ReplicaSet to N% of `drainer.replicas`.
  strategy:
    canary:
      {{- with $ar.canary.steps }}
      steps:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ar.canary.dynamicStableScale }}
      dynamicStableScale: {{ . }}
      {{- end }}
      {{- with $ar.canary.abortScaleDownDelaySeconds }}
      abortScaleDownDelaySeconds: {{ . }}
      {{- end }}
      {{- with $ar.canary.antiAffinity }}
      antiAffinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $ar.canary.maxSurge }}
      maxSurge: {{ . }}
      {{- end }}
      {{- with $ar.canary.maxUnavailable }}
      maxUnavailable: {{ . }}
      {{- end }}
  {{- else }}
  strategy:
    {{- toYaml (.Values.drainer.strategy | default .Values.global.strategy) | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "hyperswitch-drainer.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/drainer-cm: {{ include (print $.Template.BasePath "/drainer/configmap.yaml") . | sha256sum }}
        checksum/drainer-secret: {{ include (print $.Template.BasePath "/drainer/secret.yaml") . | sha256sum }}
        {{- with (.Values.drainer.podAnnotations | default .Values.global.podAnnotations) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app: {{ include "hyperswitch-drainer.name" . }}
        version: {{ include "version.suffix" (.Values.services.drainer.version | toString) | quote }}
        {{- include "hyperswitch.labels" . | nindent 8 }}
        {{- with (.Values.drainer.labels | default .Values.global.labels) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.drainer.affinity | default .Values.global.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.drainer.terminationGracePeriodSeconds | default .Values.global.terminationGracePeriodSeconds }}
      {{- if or .Values.initDB.enable .Values.redisMiscConfig.checkRedisIsUp.initContainer.enable }}
      initContainers:
        {{- if .Values.initDB.enable }}
        {{- include "postgresql.initContainer.check.ready" . | nindent 8 }}
        {{- end }}
        {{- if .Values.redisMiscConfig.checkRedisIsUp.initContainer.enable }}
        {{- include "redis.initContainer.check.ready" . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: hyperswitch-drainer
          image: {{ include "hyperswitch-drainer.image" . }}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          {{- if .Values.drainer.resources }}
          resources:
            {{- toYaml .Values.drainer.resources | nindent 12 }}
          {{- end }}
          env:
            {{- with .Values.global.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.drainer.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if not .Values.disableInternalSecrets }}
            {{- include "drainer.secrets.envs" . | nindent 12}}
            {{- end }}
            {{- include "generic.envs" . | nindent 12 }}
            {{- range $key, $value := .Values.drainer.env }}
            {{- if kindIs "string" $value }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- else }}
            - name: {{ $key }}
              {{- toYaml $value | nindent 14 }}
            {{- end }}
            {{- end }}
            {{- include "hyperswitch.configToEnvRefs" (dict "config" .Values.drainer.configs "prefix" "DRAINER" "context" .) | nindent 12 }}
          envFrom:
            - configMapRef:
                name: drainer-cm-{{ .Release.Name }}
          {{- if not .Values.disableInternalSecrets }}
            - secretRef:
                name: drainer-secret-{{ .Release.Name }}
          {{- end }}
          {{- if .Values.superposition_fallback_efs.enabled }}
          volumeMounts:
            - mountPath: {{ .Values.superposition_fallback_efs.mountPath | default "/mnt/data" }}
              name: {{ .Values.superposition_fallback_efs.volumeName | default "superposition-config-backup" }}
              readOnly: true
          {{- end }}
      volumes:
        {{- if .Values.superposition_fallback_efs.enabled }}
        - name: {{ .Values.superposition_fallback_efs.volumeName | default "superposition-config-backup" }}
          persistentVolumeClaim:
            claimName: {{ .Values.superposition_fallback_efs.pvcName }}
        {{- end }}
      serviceAccountName: {{ include "hyperswitch-router-sa.name" . }}
{{- end }}
