# Hyperswitch Monitoring Stack Configuration

# Global configuration
global:
  # Global image registry that can override all imageRegistry fields
  imageRegistry: null
  # Some charts use this format for global image configuration
  image:
    registry: null
  # Tolerations to be applied to all monitoring components
  tolerations: []
  labels:
    stack: "hyperswitch-monitoring"

# kube-prometheus-stack configuration
kube-prometheus-stack:
  enabled: true

  # Prometheus Operator configurations
  prometheusOperator:
    admissionWebhooks:
      enabled: true
      patch:
        podAnnotations:
          sidecar.istio.io/inject: "false"

  alertmanager:
    enabled: true
    alertmanagerSpec:
      # Tolerations for Alertmanager pods
      tolerations: []

  # Prometheus configuration
  prometheus:
    enabled: true
    prometheusSpec:
      # Tolerations for Prometheus pods
      tolerations: []

      # Resource requests and limits
      resources:
        requests:
          memory: 256Mi
          cpu: 50m
        limits:
          memory: 1Gi
          cpu: 500m

      # Retention period
      retention: 30d

      # Disable the default behavior of auto-adding release label selector
      # This allows Prometheus to discover all ServiceMonitors without label matching
      serviceMonitorSelectorNilUsesHelmValues: false
      # Empty selector - discovers all ServiceMonitors in allowed namespaces
      serviceMonitorSelector: {}

      # namespaces to monitor
      serviceMonitorNamespaceSelector: {}

      # Storage configuration
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi

      # Additional scrape configs from hyperswitch-stack
      additionalScrapeConfigs:
        - job_name: "kubernetes-pods"
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              target_label: __address__
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: "$1:$2"

        - job_name: "kubernetes-nodes"
          kubernetes_sd_configs:
            - role: node
          relabel_configs:
            - action: labelmap
              regex: __meta_kubernetes_node_label_(.+)

  # Grafana configuration
  grafana:
    enabled: true
    adminPassword: "admin"

    # Tolerations for Grafana pods
    tolerations: []

    # Grafana image
    image:
      tag: 10.0.1

    # Install additional plugins
    plugins:
      - volkovlabs-variable-panel

    # Disable default datasources from kube-prometheus-stack
    defaultDatasourceEnabled: false

    # Configure datasources - these will be processed as plain YAML, not templates
    additionalDataSources: []

    # Disable the default prometheus datasource
    prometheus:
      datasource:
        enabled: false

    # Sidecar configuration for datasources
    sidecar:
      datasources:
        enabled: true
        label: grafana_datasource
        labelValue: "1"
        # Search in the current namespace
        searchNamespace: "{{ .Release.Namespace }}"
        # Disable default behavior
        defaultDatasourceEnabled: false
        # Skip TLS verification for datasources
        skipTlsVerify: true
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        # Search in all namespaces to find dashboards
        searchNamespace: ALL
        # Provider configuration
        provider:
          allowUiUpdates: false


# Loki configuration
loki:
  enabled: true
  fullnameOverride: "loki"
  global:
    image:
      registry: null

  # Loki configuration
  loki:
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095

    commonConfig:
      replication_factor: 1

    storage:
      type: filesystem

    schemaConfig:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 168h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20

  # Single binary deployment
  deploymentMode: SingleBinary

  singleBinary:
    replicas: 1
    # Tolerations for Loki pods
    tolerations: []
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Explicitly disable other deployment modes
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    replicas: 0

  # Disable chunks cache to reduce memory requirements
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

# Promtail configuration
promtail:
  enabled: true

  # Tolerations for Promtail pods
  tolerations: []

  config:
    clients:
      - url: "http://loki:3100/loki/api/v1/push"

    snippets:
      pipelineStages:
        - cri: {}

      # Extra relabel configs to filter hyperswitch pods
      extraRelabelConfigs:
        - action: "keep"
          regex: "(hyperswitch-.*|.*-hyperswitch-.*)"
          source_labels: ["__meta_kubernetes_pod_label_app"]

# OpenTelemetry Collector configuration
opentelemetry-collector:
  enabled: true

  mode: "deployment"

  # Specify which namespace should be used to deploy the resources into
  namespaceOverride: ""

  presets:
    kubernetesAttributes:
      enabled: true
      extractAllPodLabels: true
      extractAllPodAnnotations: false

  alternateConfig:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317

    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      # Adds resource attributes (added by k8sattributes processor) as metrics labels
      transform:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["source_namespace"], resource.attributes["k8s.namespace.name"])
              - set(attributes["source_pod"], resource.attributes["k8s.pod.name"])
              - set(attributes["source_app"], resource.attributes["app"])
              - set(attributes["source_version"], resource.attributes["version"])

    exporters:
      debug:
        verbosity: detailed
      prometheus:
        endpoint: ${env:MY_POD_IP}:9898

    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133

    service:
      telemetry:
        logs:
          level: DEBUG
          encoding: json
        metrics:
          level: detailed
          address: ${env:MY_POD_IP}:8888
      extensions:
        - health_check
      pipelines:
        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - transform
            - batch
          exporters:
            - prometheus

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.122.1

  nodeSelector: {}
  tolerations: []
  affinity: {}

  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
      appProtocol: grpc
    otel-metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP
    hs-metrics:
      enabled: true
      containerPort: 9898
      servicePort: 9898
      protocol: TCP
    otlp-http:
      enabled: false
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

  resources:
    # Due to the `k8sattributes` processor, the collector uses more than 2 GiB of RAM and 1000+m vCPU  at startup,
    # and later drops to ~300 MiB of RAM and ~200m vCPU.
    limits:
      cpu: 1500m
      memory: 4Gi
    requests:
      cpu: 250m
      memory: 512Mi

  replicaCount: 1

  serviceMonitor:
    enabled: true
    metricsEndpoints:
      - port: otel-metrics
        honorLabels: true
        interval: 30s
        path: /metrics
      - port: hs-metrics
        honorLabels: true
        interval: 15s
        path: /metrics

# -----------------------------------------------------------------------
# Alternate metrics backend: VictoriaMetrics, instead of kube-prometheus-
# stack's bundled single-instance Prometheus. Off by default - this chart
# still ships Prometheus as-is for anyone not opting in.
#
# Enable ONE metrics backend, not both: both would reconcile the same
# ServiceMonitor/PrometheusRule CRDs independently, and VictoriaMetrics'
# own operator already auto-converts ServiceMonitor -> its own VMServiceScrape
# (disable_prometheus_converter: false below), so there's nothing to gain
# from running both. To switch: set kube-prometheus-stack.enabled: false
# and prometheus-operator-crds.enabled + victoria-metrics-k8s-stack.enabled:
# true.
#
# Sizing below is deliberately generic/modest (not tuned for any particular
# traffic level) - re-derive storage sizes and replica counts from your own
# measured cardinality and ingestion rate before relying on these for real
# load. No cloud-specific plumbing is set here (no object-storage, no
# cloud-provider service discovery, no image-registry mirroring) - add
# whatever your environment needs via its own values overlay (see
# values-victoriametrics-alloy.yaml for a worked example).
prometheus-operator-crds:
  enabled: false

victoria-metrics-k8s-stack:
  enabled: false

  # Don't also deploy this chart's own Grafana/Alertmanager/vmalert - kube-
  # prometheus-stack.grafana (or a standalone Grafana) and
  # kube-prometheus-stack.alertmanager already cover both, and alerting
  # rules/routing are out of scope for this metrics-backend swap. Enable
  # vmalert yourself (with a real notifier target) via your own values
  # overlay if you want VictoriaMetrics-native alerting instead.
  grafana:
    enabled: false
  alertmanager:
    enabled: false
  vmalert:
    enabled: false
  kube-state-metrics:
    enabled: true
  prometheus-node-exporter:
    enabled: true

  vmsingle:
    enabled: false

  vmcluster:
    enabled: true
    spec:
      retentionPeriod: "14"
      vmstorage:
        replicaCount: 1
        storage:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 20Gi
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
      vmselect:
        replicaCount: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
      vminsert:
        replicaCount: 1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

  vmagent:
    enabled: true
    spec:
      replicaCount: 1
      # Scrapes ServiceMonitor/PodMonitor/VMServiceScrape objects already in
      # the cluster by default (standard operator behavior) - add your own
      # environment's service-discovery (cloud-provider SD, extra
      # scrape_configs, remote_write destinations beyond this cluster's own
      # vminsert) via your own values overlay, not here.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 512Mi

# -----------------------------------------------------------------------
# Alternate log-shipping agent: Grafana Alloy, instead of Promtail (which
# upstream Grafana has put into maintenance mode in favor of Alloy). Off by
# default - this chart still ships Promtail as-is for anyone not opting in.
#
# The minimal config below just tails pod logs and forwards them to this
# chart's own bundled `loki` dependency (same endpoint the promtail block
# above already uses: http://loki:3100). Replace/extend it via your own
# values overlay for real relabeling, filtering, or a different log
# backend - this is deliberately not more than a working starting point.
alloy:
  enabled: false
  # NOTE: this chart's own internal values schema nests everything Alloy-
  # process-specific under a SECOND, inner `alloy:` key (confirmed against
  # the chart's own values.yaml/templates/configmap.yaml) - this is not a
  # typo. The outer `alloy:` above is the dependency name/condition key;
  # this inner one is the chart's own namespace for its config.
  alloy:
    configMap:
      content: |
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://loki:3100/loki/api/v1/push"
          }
        }
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

# https://artifacthub.io/packages/helm/bitnami/postgresql
postgresql:
  # @section -- Dependencies configuration for grafana datasource
  # When external is false, the host will be prefixed with {{ .Release.Name }}- (e.g., hypers-v1-postgresql)
  external: false
  primary:
    host: "postgresql"
    port: 5432
    username: "hyperswitch"
    password: "ZGJwYXNzd29yZDEx"
    database: "hyperswitch"

# Grafana ingress configuration
grafana:
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/backend-protocol-version: HTTP1
      alb.ingress.kubernetes.io/group.name: hyperswitch-monitoring-alb-ingress-group
      alb.ingress.kubernetes.io/ip-address-type: ipv4
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      alb.ingress.kubernetes.io/load-balancer-name: hyperswitch-monitoring
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/security-groups: "loadbalancer-sg"
      alb.ingress.kubernetes.io/tags: stack=hyperswitch-monitoring
      alb.ingress.kubernetes.io/target-type: ip
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls: []

# Load balancer configuration
loadBalancer:
  targetSecurityGroup: "loadbalancer-sg"
