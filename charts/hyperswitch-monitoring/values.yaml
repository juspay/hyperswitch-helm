# Hyperswitch Monitoring Stack Configuration

# Global configuration
global:
  # Global image registry that can override all imageRegistry fields
  imageRegistry: null
  # Some charts use this format for global image configuration
  image:
    registry: null
  # Tolerations to be applied to all monitoring components
  tolerations: []
  labels:
    stack: "hyperswitch-monitoring"

# Loki configuration
loki:
  enabled: true
  fullnameOverride: "loki"
  global:
    image:
      registry: null

  # Loki configuration
  loki:
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095

    commonConfig:
      replication_factor: 1

    storage:
      type: filesystem

    schemaConfig:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 168h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20

  # Single binary deployment
  deploymentMode: SingleBinary

  singleBinary:
    replicas: 1
    # Tolerations for Loki pods
    tolerations: []
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Explicitly disable other deployment modes
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  gateway:
    replicas: 0

  # Disable chunks cache to reduce memory requirements
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

# OpenTelemetry Collector configuration
opentelemetry-collector:
  enabled: true

  mode: "deployment"

  # Specify which namespace should be used to deploy the resources into
  namespaceOverride: ""

  presets:
    kubernetesAttributes:
      enabled: true
      extractAllPodLabels: true
      extractAllPodAnnotations: false

  alternateConfig:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:4317

    processors:
      batch: {}
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      # Adds resource attributes (added by k8sattributes processor) as metrics labels
      transform:
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["source_namespace"], resource.attributes["k8s.namespace.name"])
              - set(attributes["source_pod"], resource.attributes["k8s.pod.name"])
              - set(attributes["source_app"], resource.attributes["app"])
              - set(attributes["source_version"], resource.attributes["version"])

    exporters:
      debug:
        verbosity: detailed
      otlphttp:
        metrics_endpoint: http://vmagent-victoria-metrics:8429/opentelemetry/v1/metrics
        tls:
          insecure: true

    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133

    service:
      telemetry:
        logs:
          level: DEBUG
          encoding: json
        metrics:
          level: detailed
          address: ${env:MY_POD_IP}:8888
      extensions:
        - health_check
      pipelines:
        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - transform
            - batch
          exporters:
            - otlphttp

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.139.0

  nodeSelector: {}
  tolerations: []
  affinity: {}

  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
      appProtocol: grpc
    otel-metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP
    hs-metrics:
      enabled: false
    otlp-http:
      enabled: false
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

  resources:
    # Due to the `k8sattributes` processor, the collector uses more than 2 GiB of RAM and 1000+m vCPU  at startup,
    # and later drops to ~300 MiB of RAM and ~200m vCPU.
    limits:
      cpu: 1500m
      memory: 4Gi
    requests:
      cpu: 250m
      memory: 512Mi

  replicaCount: 1

  serviceMonitor:
    enabled: true
    metricsEndpoints:
      - port: otel-metrics
        honorLabels: true
        interval: 30s
        path: /metrics

victoria-metrics-k8s-stack:
  enabled: true
  fullnameOverride: "victoria-metrics"

  grafana:
    enabled: true
    adminPassword: "admin"
    image:
      tag: 10.0.1
    plugins:
      - volkovlabs-variable-panel
    additionalDataSources: []

  alertmanager:
    enabled: true
  vmalert:
    enabled: false
  kube-state-metrics:
    enabled: true
  prometheus-node-exporter:
    enabled: true

  vmsingle:
    enabled: true
    spec:
      retentionPeriod: "14"
      storage:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 20Gi
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi

  vmcluster:
    enabled: false

  vmagent:
    enabled: true
    spec:
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 512Mi

alloy:
  enabled: true
  alloy:
    configMap:
      content: |
        discovery.kubernetes "pods" {
          role = "pod"
        }

        discovery.relabel "pods" {
          targets = discovery.kubernetes.pods.targets
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.relabel.pods.output
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://loki:3100/loki/api/v1/push"
          }
        }
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

# https://artifacthub.io/packages/helm/bitnami/postgresql
postgresql:
  # @section -- Dependencies configuration for grafana datasource
  # When external is false, the host will be prefixed with {{ .Release.Name }}- (e.g., hypers-v1-postgresql)
  external: false
  primary:
    host: "postgresql"
    port: 5432
    username: "hyperswitch"
    password: "ZGJwYXNzd29yZDEx"
    database: "hyperswitch"

# Grafana ingress configuration
grafana:
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/backend-protocol: HTTP
      alb.ingress.kubernetes.io/backend-protocol-version: HTTP1
      alb.ingress.kubernetes.io/group.name: hyperswitch-monitoring-alb-ingress-group
      alb.ingress.kubernetes.io/ip-address-type: ipv4
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      alb.ingress.kubernetes.io/load-balancer-name: hyperswitch-monitoring
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/security-groups: "loadbalancer-sg"
      alb.ingress.kubernetes.io/tags: stack=hyperswitch-monitoring
      alb.ingress.kubernetes.io/target-type: ip
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: Prefix
    tls: []

# Load balancer configuration
loadBalancer:
  targetSecurityGroup: "loadbalancer-sg"
