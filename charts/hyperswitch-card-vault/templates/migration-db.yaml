{{- if .Values.initDB.enable }}
apiVersion: batch/v1
kind: Job
metadata:
  name: hyperswitch-create-locker-db-{{ regexReplaceAll "\\." .Values.server.version "-" }}
  labels:
    app: hyperswitch-create-locker-db-{{ regexReplaceAll "\\." .Values.server.version "-" }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure

      {{- with (default .Values.global.tolerations .Values.server.pod.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.affinity .Values.server.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.nodeSelector .Values.server.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        {{- include "locker-psql.initContainer.check.ready" . | nindent 8 }}

      containers:
        - name: run-locker-db-migration
          {{- $registry := .Values.global.imageRegistry | default .Values.initDB.migration.imageRegistry }}
          image: "{{ $registry }}/{{ .Values.initDB.migration.image }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |-
              set -eo pipefail
              apt-get update -qq
              apt-get install -y -qq curl tar xz-utils libpq5 ca-certificates
              # v0.9.0 creates indexes concurrently. diesel_cli 2.x honours the
              # run_in_transaction=false metadata that the old 1.4.1 image ignored.
              curl --proto '=https' --tlsv1.2 -LsSf "$DIESEL_INSTALLER" | sh
              export PATH="$HOME/.cargo/bin:$PATH"
              diesel --version
              echo "Downloading migrations..."
              curl -fsSL --retry 3 --retry-delay 5 -o hyperswitch-card-vault.tar.gz https://github.com/juspay/hyperswitch-card-vault/archive/refs/tags/$VERSION.tar.gz
              tar -xzvf hyperswitch-card-vault.tar.gz --transform 's|[^/]*/|hyperswitch-card-vault/|'
              cd hyperswitch-card-vault
              # Only run migrations; schema regeneration is a development task.
              rm -f diesel.toml

              echo "Running Diesel migrations"
              diesel migration run \
                --database-url postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$DBNAME

              echo "Completed Card-Vault database migration"
          env:
            - name: DIESEL_INSTALLER
              value: {{ .Values.initDB.migration.dieselInstaller | quote }}
            - name: POSTGRES_HOST
              value: {{ include "locker-psql.host" . }}
            - name: POSTGRES_PORT
              value: {{ include "locker-psql.port" . }}
            - name: DBNAME
              value: {{ include "locker-psql.name" . }}
            - name: POSTGRES_USER
              value: {{ include "locker-psql.username" . }}
            - name: VERSION
              value: {{ .Values.server.version }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: locker-secrets-{{ .Release.Name }}
                  key: LOCKER__DATABASE__PASSWORD
{{- end }}
