{{- if .Values.initDB.enable }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-hyperswitch-create-db-{{ regexReplaceAll "\\." (.Values.services.router.version | toString) "-" }}
  labels:
    app: {{ .Release.Name }}-hyperswitch-create-db-{{ regexReplaceAll "\\." (.Values.services.router.version | toString) "-" }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      labels:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      {{- with (default .Values.global.tolerations .Values.server.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.affinity .Values.server.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (default .Values.global.nodeSelector .Values.server.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "postgresql.initContainer.check.ready" . | nindent 8 }}
      containers:
        - name: run-hyperswitch-db-migration
          {{- $registry := .Values.global.imageRegistry | default .Values.initDB.migration.imageRegistry }}
          image: "{{ $registry }}/{{ .Values.initDB.migration.image }}"
          imagePullPolicy: IfNotPresent
          command: [ '/bin/bash', '-c' ]
          #language=bash
          args:
            - |-
              set -eo pipefail
              apt-get update -qq
              apt-get install -y -qq curl tar xz-utils libpq5 ca-certificates
              # Install diesel_cli the same way hyperswitch's own migration runner does
              # (docker/migration-runner.Dockerfile). The migrations that create indexes
              # concurrently carry `run_in_transaction = false` in metadata.toml, which only
              # diesel_cli 2.x honours - an older CLI stops at the first such migration and
              # leaves the schema half-applied.
              curl --proto '=https' --tlsv1.2 -LsSf "$DIESEL_INSTALLER" | sh
              export PATH="$HOME/.cargo/bin:$PATH"
              diesel --version
              curl -fsSL --retry 3 --retry-delay 5 -o hyperswitch.tar.gz https://github.com/juspay/hyperswitch/archive/refs/$REFERENCE/$ROUTER_VERSION.tar.gz
              tar -xzf hyperswitch.tar.gz --transform 's|[^/]*/|hyperswitch/|'
              cd hyperswitch
              # The repo's diesel.toml carries a [print_schema] section that makes diesel_cli
              # regenerate crates/diesel_models/src/schema.rs AFTER `migration run` and apply
              # drop_id.patch on top. At several release tags (v1.126.0, v1.127.0) that patch
              # no longer applies ("Failed to apply patch: error applying hunk #5"), so diesel
              # exits non-zero AFTER every migration applied cleanly - failing this hook and
              # with it the whole install. Schema regeneration is a repo-development concern,
              # not a migration one: drop the config so only migrations run. The migrations
              # themselves live at the diesel default ./migrations, so nothing else is lost.
              rm -f diesel.toml
              diesel migration --database-url postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:5432/$DBNAME run
              echo "Completed hyperswitch database migration"
          env:
            - name: DIESEL_INSTALLER
              value: {{ .Values.initDB.migration.dieselInstaller | quote }}
            - name: REFERENCE
              value: {{ .Values.initDB.refs }}
            - name: ROUTER_VERSION
              value: {{ .Values.services.router.version | toString | quote}}
            - name: POSTGRES_HOST
              value: {{ include "postgresql.host" . }}
            - name: DBNAME
              value: {{ include "postgresql.database" . }}
            - name: POSTGRES_USER
              value: {{ include "postgresql.username" . }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.master.plainPassword.secret" . }}
                  key: {{ include "postgresql.master.plainPassword.key" . }}
{{- end }}
