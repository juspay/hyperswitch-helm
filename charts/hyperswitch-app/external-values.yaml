# =============================================================================
# hyperswitch-app — overrides for a STANDALONE install on an external cluster
# =============================================================================
#
# Chart      : charts/hyperswitch-app 1.3.2 (appVersion v1.126.0)
# Repo commit: 39801d6541b59bc469dad2deb449c56bfcb1beb0 (main, 2026-09-21)
# Verified   : 2026-09-22, k8s v1.30.7 (arm64), release "hs", namespace "hs-test"
#              -> 16 pods Running; router /health/ready and PMM /v2/health/ready
#                 both HTTP 200 with database, redis, vault, analytics,
#                 outgoing_request and unified_connector_service all true.
#
# This file contains ONLY values that differ from the chart's own values.yaml.
# Anything the chart already defaults correctly is deliberately absent — read
# charts/hyperswitch-app/values.yaml for the full surface.
#
# Every override is tagged with WHY it exists:
#   [A] version-skew - only because services.*.version is NEWER than the chart's
#                      appVersion. DELETE these if you pin v1.126.0.
#   [B] chart defect - needed at every version, including chart defaults.
#   [C] sizing/policy - ordinary environment choices, tune freely.
#
# Install:
#   helm dependency update .
#   helm install hs . -n hyperswitch --create-namespace -f external-values.yaml
#
# -----------------------------------------------------------------------------
# HOW THIS DIFFERS FROM THE REFERENCE (ArgoCD) DEPLOYMENT
# -----------------------------------------------------------------------------
# The juspay integ/sandbox/prod deployments run this chart very differently, and
# that is why they do not hit most of the [B] items:
#
#   * They pin a DATE-MATCHED CHART TAG, not main. e.g. chartVersion
#     app-2026.09.22.0 with imageTag 2026.09.22.0-fred. That tag's bundled
#     configs/router-sandbox.toml is regenerated for that image and DOES contain
#     the connectors main is missing — so [A1] does not apply to them.
#     >> If you deploy from a release tag whose date matches your image, you can
#        delete the [A1] block below. It is needed when tracking main.
#
#   * They disable EVERY bundled dependency and point at managed infra:
#       redis, postgresql, kafka, clickhouse, mailhog, vector,
#       hyperswitch-card-vault, superposition  -> all enabled: false
#       externalRedis / externalPostgresql      -> ElastiCache / RDS
#     So [B2] (pool sizes vs the bundled PostgreSQL) never applies there.
#
#   * They set a REAL egress proxy (Squid) with the locker and ClickHouse hosts
#     in bypass_proxy_hosts, so [B1] is configuration for them, not a defect.
#
#   * They run encryption_management/secrets_management with aws_kms, which makes
#     the chart write the ConfigMap keys the drainer references — so [B3a] never
#     fires for them. See the drainer note below.
#
#   * They set initDB.enable: false and migrate out of band, same as this file.
#
#   * They do NOT run paymentMethodModular, so [B4] is unexercised upstream.
#
# This file instead keeps the bundled dependencies ON, for a self-contained
# install. For production, prefer the reference pattern: disable the bundled
# datastores and use externalPostgresql / externalRedis / external Kafka etc.
#
# =============================================================================
# ►►► READ THIS FIRST — THINGS YOU MUST CHANGE ◄◄◄
# =============================================================================
#
# 1. RELEASE NAME. Helm does not template values files.
#    paymentMethodModular.configs.internal_services.payments_base_url below
#    hard-codes the release name "hs". Change it if you install under any other
#    name, or PMM will point at nothing.
#
# 2. SECRETS. This file sets only the two Superposition secrets (the chart leaves
#    them empty). Everything else keeps the chart's DEVELOPMENT defaults, which
#    are PUBLIC. Before real traffic, override at least:
#      server.configs.secrets.{admin_api_key,jwt_secret,master_enc_key,
#                              recon_admin_api_key}
#      postgresql.global.postgresql.auth.password   (default "ZGJwYXNzd29yZDEx")
#      clickhouse.auth.password                     (default "jhdvfvsnbdj")
#    If you change the PostgreSQL password you MUST mirror it into
#    superposition.secrets.db_password below. Likewise
#    superposition.secrets.superposition_token must equal
#    server.configs.superposition.token (chart default "123456").
#    Prefer disableInternalSecrets: true + externalSecretsOperator.* over
#    putting real values here.
#
# 3. initDB is DISABLED below. Read the [A3] note before your first install or
#    you will come up with an empty schema.
# =============================================================================


# -----------------------------------------------------------------------------
# Image versions — the knob that decides whether the [A] blocks are needed
# -----------------------------------------------------------------------------
services:
  router:
    version: "2026.09.09.1-hotfix5"
  consumer:
    version: "2026.09.09.1-hotfix5"
  producer:
    version: "2026.09.09.1-hotfix5"
  drainer:
    version: "2026.09.09.1-hotfix5"


server:
  # [C] Chart defaults are requests 200m/500Mi, limit 1Gi — low for real traffic.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

  configs:

    # ---- [B1] CHART DEFECT: proxy is ON by default with placeholder URLs ------
    # The chart ships proxy.enabled: true with http_url "http://proxy_http_url".
    # Anything not matched by bypass_proxy_hosts ("localhost, cluster.local") is
    # sent to that non-existent host and fails with:
    #   dns error: failed to lookup address information: Name or service not known
    # locker.host defaults to the bare name "http://hyperswitch-vault", which does
    # NOT match "cluster.local" — so the locker deep-health check fails, and every
    # connector call would go to the fake proxy. Nothing errors at boot: it is
    # silent. THE SINGLE MOST IMPORTANT OVERRIDE IN THIS FILE.
    #
    # If you DO have an egress proxy (the reference deployment uses Squid), set
    # enabled: true with real URLs and put your in-cluster hosts in the bypass
    # list, e.g. "localhost, cluster.local, <locker-host>, <clickhouse-host>".
    proxy:
      enabled: false

    # ---- [B2] CHART DEFECT: pool sizes exceed the BUNDLED PostgreSQL ----------
    # Chart defaults are master 20 + replica 20 + analytics 5 per router-binary
    # pod. Bundled PostgreSQL runs max_connections=100 with 3 reserved = 97 usable.
    # With chart defaults (autoscaling minReplicas 3 + consumer + producer) that is
    # ~5 pods x 40 = ~200 connections, and a service dies at boot with:
    #   FATAL: remaining connection slots are reserved for roles with the
    #          SUPERUSER attribute
    # Delete this block if you use externalPostgresql (RDS etc.) with a large
    # max_connections, or raise it via postgresql.primary.extendedConfiguration.
    master_database:
      pool_size: '5'
    replica_database:
      pool_size: '5'
    analytics:
      sqlx:
        pool_size: 3

    # ---- [A1] VERSION-SKEW: connectors added after the chart's appVersion -----
    # configs/router-sandbox.toml ships INSIDE the chart. On main it is frozen at
    # v1.126.0, so a newer router panics at boot on the first connector with no
    # base_url:
    #   Failed to validate router configuration: Invalid configuration value
    #   provided: base_url must not be empty for gotyme_sanlam
    # Values from config/deployments/sandbox.toml @ 2026.09.09.1-hotfix5.
    #
    # DELETE THIS BLOCK if you pin v1.126.0, or if you deploy from a release tag
    # whose bundled TOML already matches your image (see the ArgoCD note above —
    # tag app-2026.09.22.0 already contains both of these).
    # To re-derive for another tag, diff the [connectors] base_url keys in
    # config/config.example.toml @ <tag> against configs/router-sandbox.toml here.
    connectors:
      gotyme_sanlam:
        base_url: "sbx"
      worldpayraft:
        base_url: "https://ws-cert.vantiv.com/merchant/servicing/apitransactions/NativeRaftApi/v1"

    events:
      kafka:
        # ---- [A2] VERSION-SKEW: topics the newer app-server hard-requires -----
        # crates/router/src/services/kafka.rs requires account_updater_topic, or
        # the router panics with:
        #   Invalid configuration value provided: Kafka Account Updater topic
        #   must not be empty
        # external_service_call_topic has its own validation guard.
        # DELETE these two if you pin v1.126.0. (The reference deployment sets
        # both in its own values, so it never hits this either.)
        account_updater_topic: hyperswitch-account-updater-events
        external_service_call_topic: hyperswitch-external-service-call-events
        # ---- [C] the chart leaves these as the literal placeholder "topic",
        # which means those events really are produced to a topic named "topic".
        routing_logs_topic: hyperswitch-routing-events
        revenue_recovery_topic: hyperswitch-revenue-recovery-events

    # ---- [B6] CHART DEFECT: UCS is deployed but never wired to the router -----
    # The chart leaves this at http://localhost:8000 even when hyperswitch-ucs is
    # enabled, so the router never talks to it.
    # VERIFIED: setting this flips deep health from
    #   "unified_connector_service": null  ->  "unified_connector_service": true
    # Host is <hyperswitch-ucs.fullnameOverride>:<grpc port> — both chart defaults.
    grpc_client:
      unified_connector_service:
        base_url: "http://hyperswitch-ucs:8000"


# [C] Chart default is enabled:true / minReplicas:3, which needs metrics-server
# and triples the DB connection demand described in [B2]. Turn back on once
# max_connections is sized for minReplicas x (master + replica pool).
autoscaling:
  enabled: false


# [C] Chart defaults are requests 100Mi / limit 256Mi — tight for these services.
consumer:
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi

producer:
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi


# -----------------------------------------------------------------------------
# drainer — left at the chart default of replicas: 0 (i.e. it does not run)
# -----------------------------------------------------------------------------
# services.drainer.enabled is true by default but drainer.replicas is 0, so the
# Deployment renders with zero replicas. Raising it to 1 exposes three defects:
#
#   [B3a] drainer.configs.{secrets_management,encryption_management}.aws_kms.*
#         are _configRef with optional:false pointing at four ConfigMap keys the
#         chart only writes when aws_kms is configured. With the chart default
#         (encryption_manager: no_encryption) those keys never exist:
#           Error: couldn't find key ROUTER__ENCRYPTION_MANAGEMENT__AWS_KMS__KEY_ID
#           in ConfigMap <ns>/<release>-hyperswitch-configs
#           -> CreateContainerConfigError
#         >> The reference deployment sets server.configs.encryption_management
#            .encryption_manager: aws_kms with a real key_id/region, which makes
#            the chart write those keys — which is why it never fires there.
#            If you use aws_kms, DELETE the two blocks below.
#
#   [B3b] the drainer's configs block has no log.file section (the router's does),
#         so the binary falls back to its built-in file appender and panics:
#           initializing rolling file appender failed: failed to create log
#           directory ... PermissionDenied
#         The reference deployment sets drainer.configs.log.file.enabled: false —
#         the same value used below.
#
#   [B3c] In THIS test environment, with a and b fixed, the drainer then exited
#         with "No redis connection found" against the bundled Redis. The
#         reference deployment runs the drainer at replicas: 1 against ElastiCache
#         without trouble, so this may be specific to the bundled Redis or to this
#         environment rather than a chart defect. Not root-caused.
#
# The workarounds are kept so that raising replicas gets you past a and b.
# The drainer only matters if you use Redis KV (server.configs.kv_config).
drainer:
  # replicas: 1        # uncomment to run it; see [B3c] first
  configs:
    # [B3a] — delete this whole block if you run encryption/secrets with aws_kms
    secrets_management:
      aws_kms:
        key_id: "kms_key_id"
        region: "us-east-1"
    encryption_management:
      encryption_manager: no_encryption
      aws_kms:
        key_id: "kms_key_id"
        region: "us-east-1"
    # [B3b]
    log:
      file:
        enabled: false


# =============================================================================
# paymentMethodModular (PMM) — V2 payment-method service
# =============================================================================
# A SECOND router in this release, sharing its database, Redis, ConfigMap, Secret
# and ServiceAccount; it differs only in configuration.
#
# Not run by the reference ArgoCD deployment, so [B4] below is unexercised there.
#
# These supplied settings are already the chart defaults and are therefore NOT
# repeated here: replicas 1, database.useReplicaForMaster false,
# configs.micro_services.payment_methods_prefix v1, configs.trace_header.*
# (x-request-id / use_incoming), autoscaling off, ingress disabled with
# path /v1/payment-methods, istio disabled.
paymentMethodModular:
  enabled: true                           # chart default: false
  fullnameOverride: hyperswitch-pm-modular

  # Its OWN image, not a -v2 tag of the router. Docker Hub only (NOT
  # docker.juspay.io). v1.0.26 is multi-arch. `latest`/`nightly` also exist and
  # are mutable — for production mirror a fixed tag into your own registry. The
  # chart builds "registry/image:tag" and cannot take a digest.
  imageRegistry: docker.io
  image: juspaydotin/hyperswitch-modular-pm
  version: v1.0.26

  configs:
    micro_services:
      use_legacy_locker: false
    locker:
      locker_enabled: false
      mock_locker: false
    # ►► RELEASE-NAME COUPLED. The main router Service is
    #    <release>-hyperswitch-server on port 80. CHANGE "hs" if you rename.
    internal_services:
      payments_base_url: http://hs-hyperswitch-server

  # ---- [B4] CHART DEFECT: the default probes 404 against this image ----------
  # modular-pm serves health ONLY at /v2/health and /v2/health/ready. Verified
  # against the running pod:
  #     404  /health       <- the chart's default probe  -> crash-loops the pod
  #     404  /v1/health                                  -> crash-loops the pod
  #     200  /v2/health
  #     200  /v2/health/ready
  # The path is INDEPENDENT of payment_methods_prefix: the APIs follow the prefix
  # (v1) but health is fixed at /v2. Without these the liveness probe kills the
  # container repeatedly (Exit Code 137).
  livenessProbe:
    httpGet:
      path: /v2/health
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /v2/health
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
    successThreshold: 1

  # [C] chart default is {} (no requests/limits)
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi


# =============================================================================
# [A3] Database schema bootstrap — READ BEFORE FIRST INSTALL
# =============================================================================
# The migration Job runs `diesel migration run`, which applies every migration and
# THEN regenerates schema.rs and applies crates/diesel_models/drop_id.patch (per
# the repo's diesel.toml). At 2026.09.09.1-hotfix5 that last step fails:
#     Failed to apply patch: error applying hunk #5
# The DATABASE IS FINE — all 527 migrations apply. Only the exit code is wrong.
# Pinning diesel_cli does not help (2.3.13 and 2.3.9 both fail); upstream's own
# migration-runner uses `latest` too.
#
# Because the Job is a post-install hook with NO hook-weight, Helm runs the five
# post-install hooks sequentially by name and this one sorts THIRD, starving the
# two after it:
#     3 <release>-hyperswitch-create-db  FAILS
#     4 <release>-superposition-schema   never runs -> Superposition schema-less
#     5 hypers-v1-clickhouse-init        never runs -> ClickHouse 0 tables
#
# Control test: the SAME step SUCCEEDS at v1.126.0 (502 migrations, exit 0).
# The reference ArgoCD deployment also sets enable: false and migrates out of band.
#
# PICK ONE:
#   (a) Pin services.*.version to v1.126.0 (or a date-matched release tag) ->
#       DELETE this block so initDB.enable returns to its default of true, and
#       delete the [A1]/[A2] blocks above.
#   (b) Stay on a newer tag -> leave this as-is and apply migrations once, before
#       installing:
#         kubectl run migrate --rm -it --image=debian:trixie-slim -n hyperswitch -- bash -c '
#           apt-get update -qq && apt-get install -y -qq curl tar xz-utils libpq5 ca-certificates
#           curl --proto "=https" --tlsv1.2 -LsSf \
#             https://github.com/diesel-rs/diesel/releases/latest/download/diesel_cli-installer.sh | sh
#           export PATH="$HOME/.cargo/bin:$PATH"
#           curl -fsSL -o hs.tar.gz \
#             https://github.com/juspay/hyperswitch/archive/refs/tags/2026.09.09.1-hotfix5.tar.gz
#           tar -xzf hs.tar.gz --transform "s|[^/]*/|hyperswitch/|" && cd hyperswitch
#           diesel migration --database-url \
#             postgres://hyperswitch:<PASSWORD>@<release>-postgresql:5432/hyperswitch run'
#       Ignore the trailing "Failed to apply patch" line — the schema is complete.
initDB:
  enable: false


# =============================================================================
# Bundled dependencies
# =============================================================================
# redis, postgresql, kafka, clickhouse, mailhog, vector and hyperswitch-card-vault
# are ALL enabled by the chart already and need no overrides here — the card vault
# subchart even defaults to the correct v0.7.0 image. Only the deviations follow.
#
# For production, disable them and use managed services instead, e.g.:
#   redis:      { enabled: false }
#   postgresql: { enabled: false }
#   externalRedis:      { enabled: true, host: ..., auth: {...} }
#   externalPostgresql: { enabled: true, primary: {...}, readOnly: {...} }

postgresql:
  primary:
    # [C] chart default is requests.cpu 150m and no memory request / no persistence
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
    persistence:
      enabled: true
      size: 20Gi
    # [B2] alternative to shrinking the pools above — give PostgreSQL more slots:
    # extendedConfiguration: |
    #   max_connections = 300

redis:
  master:
    # [C] chart sets no explicit persistence
    persistence:
      enabled: true
      size: 8Gi

# ---- UCS / connector-service -------------------------------------------------
# Chart default is enabled: false. Everything else about it (ghcr registry,
# juspay/connector-service repo, fullnameOverride, ports 8000/8080) is already
# correct in the chart and is not repeated here.
#
# The chart's default tag main-b1487cb is kept deliberately: the requested
# 2026.09.07.2 is NOT published — the git tag exists in juspay/connector-service
# but no image exists at ghcr.io/juspay/connector-service (nor on docker.juspay.io
# or any other path checked). Newest published date-style tag is ~2026.03.13.0;
# everything after is main-<sha>. Set image.tag here once that is resolved.
# Router wiring is in server.configs.grpc_client above — see [B6].
hyperswitch-ucs:
  enabled: true
  config:
    log:
      console:
        level: "INFO"                     # [C] chart default is DEBUG


# =============================================================================
# Superposition
# =============================================================================
# ►► [B5] The chart applies Superposition's SCHEMA but never creates the
#    org/workspace the router is pointed at. Verified after a clean install:
#        GET /organisations            -> []
#        GET /config (org=hyperswitch) -> HTTP 400
#    Every router therefore logs, continuously:
#        LocalResolutionProvider: config refresh failed, keeping last known good:
#          Network error: Failed to fetch config: service error
#    and silently runs off the seed file forever. Superposition is healthy as a
#    SERVICE but is NOT functioning as a config source. Either create the
#    "hyperswitch" org + workspace out of band, or accept that only the fallback
#    is ever used. superpositionFallback MUST stay enabled either way.
#    (The reference deployment sidesteps this entirely: superposition.enabled:
#    false — it does not run Superposition at all.)
#
# Version note: the ghcr image stream has NO "v" prefix (0.118.0) but the schema
# ref DOES (v0.118.0). Keep the two in step — bumping the image alone runs the
# binary against an older schema. The subchart is pinned at 0.112.0 in Chart.yaml;
# 0.118.0 was verified working against it with a live API call.
#
# db_host must match superpositionDB.aliasService (chart default superposition-db).
# db_name/db_user/db_password must match this release's PostgreSQL credentials.
superposition:
  enabled: true
  image:
    tag: "0.118.0"                        # no leading "v"
  configs:
    db_host: "superposition-db:5432"
    db_name: "hyperswitch"
    db_user: "hyperswitch"
    rust_log: info                        # [C] chart default is debug
  secrets:
    db_password: "ZGJwYXNzd29yZDEx"       # ►► must match postgresql auth password
    superposition_token: "123456"         # ►► must match server.configs.superposition.token

# Creates the release-independent alias Service the subchart's static db_host
# needs, plus the Job that applies the Superposition global schema.
# ►► Safe only when ONE release owns the namespace — aliasService has a fixed
#    name, so two releases in one namespace would collide on it.
superpositionDB:
  enable: true
  migration:
    version: v0.118.0                     # WITH the "v" — keep in step with the image tag

# The router needs a Superposition config source at boot and falls back to this
# seed when the endpoint is unreachable or its workspace is empty. Given [B5],
# this is what actually serves config in practice — do not disable it.
# source: fetch (the chart default) needs egress to raw.githubusercontent.com.
# Without that, use source: configMap and create it yourself:
#   curl -sfLO https://raw.githubusercontent.com/juspay/hyperswitch/2026.09.09.1-hotfix5/config/superposition_seed.toml
#   kubectl create configmap superposition-seed -n hyperswitch \
#     --from-file=superposition_seed.toml=superposition_seed.toml
#   (use `kubectl create`, not `apply` — the file is ~450 kB)
superpositionFallback:
  enabled: true


# =============================================================================
# Known issues NOT fixable from a values file (chart code changes needed)
# =============================================================================
# * Large integers render into env as scientific notation, e.g.
#     ROUTER__LOCKER__TTL_FOR_STORAGE_IN_SECS                   = 2.20752e+08
#     ROUTER__REVENUE_RECOVERY__MONITORING_THRESHOLD_IN_SECONDS = 1.0368e+07
#     ROUTER__REVENUE_RECOVERY__REDIS_TTL_IN_SECONDS            = 3.888e+06
#   values.yaml must quote these, as it already does for pool_size / port.
#
# * templates/misc/clickhouse.yaml hardcodes clickhouse/clickhouse-client:latest —
#   unpinned, repo not configurable, and amd64-only.
#
# * The vendored card-vault 0.1.7 still uses christophwurst/diesel-cli:latest —
#   the image this chart's own values.yaml documents as pinning diesel 1.4.1 and
#   silently half-applying schemas. Also amd64-only.
#
# * Failed hook Jobs survive `helm uninstall` (hook-delete-policy is
#   hook-succeeded only), leaving an orphan CrashLooping in the namespace:
#     kubectl delete job <release>-hyperswitch-create-db-<version> -n <ns>
#
# * The post-install hooks carry no hook-weight, so one failure starves the rest
#   (see [A3]).
#
# * main's configs/router-*.toml lags the published release tags (see the ArgoCD
#   note at the top) — deploying from main is what makes [A1] necessary.
# =============================================================================
